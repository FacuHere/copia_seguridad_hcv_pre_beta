openapi: 3.0.3
info:
  title: Historial Clínico Visual API
  version: 1.0.0
  description: >-
    Especificación basada en las rutas Express y los contratos encontrados en el código.
    Los errores enumerados son los observados; el requestId del cuerpo no se incluye en
    todas las respuestas actuales.
    El soporte DICOM permite cargas individuales de varios .dcm por estudio, conservación
    de bytes originales, SHA-256 y descarga autorizada. La comprobación de contenido DICOM
    solo exige un archivo no vacío, además de los controles generales de extensión/MIME,
    tamaño, nombre y ruta; no interpreta DICM ni valida completamente el formato.
    No incluye visor, interpretación de tags o series, PACS, DICOMweb o integración con equipos.
    Las pruebas realizadas son sintéticas; queda pendiente comprobar DICOM reales
    representativos y sus tamaños.
servers:
  - url: http://127.0.0.1:3000
    description: Servidor local de desarrollo; ajuste el host y puerto al entorno autorizado.
tags:
  - name: Salud
  - name: Autenticación
  - name: Pacientes
  - name: Estudios
  - name: Documentos
  - name: Respaldos
paths:
  /api/health/database:
    get:
      tags: [Salud]
      summary: Comprueba que se puede obtener una conexión a MariaDB
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '200':
          description: Conexión disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: connected }
        '503':
          description: No se pudo obtener una conexión a MariaDB
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: unavailable }
                  database: { type: string, example: disconnected }
  /api/health/storage:
    get:
      tags: [Salud]
      summary: Consulta el estado de preparación del almacenamiento
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '200':
          description: Almacenamiento listo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageHealth' }
        '503':
          description: Almacenamiento no configurado, recuperándose o bloqueado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageHealth' }
  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Inicia sesión y establece la cookie HttpOnly
      description: Diez fallos de credenciales por IP dentro de 15 minutos activan un bloqueo de 15 minutos. Un login correcto limpia el contador.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '200':
          description: Sesión creada; el token se entrega solo en la cookie Set-Cookie
          headers:
            Set-Cookie:
              description: Cookie hcv_session; HttpOnly, SameSite=Strict, Path=/api. Secure depende de COOKIE_SECURE.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/AuthenticatedUser' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '429':
          description: Se alcanzó el límite temporal de intentos
          headers:
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /api/auth/me:
    get:
      tags: [Autenticación]
      summary: Devuelve el usuario de la sesión actual
      security: [{ SessionCookie: [] }]
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '200':
          description: Usuario y roles de la sesión
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /api/auth/logout:
    post:
      tags: [Autenticación]
      summary: Invalida la sesión actual y borra la cookie
      security: [{}, { SessionCookie: [] }]
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '204': { description: Sesión cerrada; no hay cuerpo de respuesta }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/pacientes:
    get:
      tags: [Pacientes]
      summary: Lista pacientes paginados
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '200':
          description: Página de pacientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PatientListItem' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
    post:
      tags: [Pacientes]
      summary: Crea un paciente
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientWrite' }
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '201':
          description: Paciente creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /api/pacientes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Pacientes]
      summary: Consulta un paciente
      security: [{ SessionCookie: [] }]
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '200':
          description: Paciente encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
    put:
      tags: [Pacientes]
      summary: Actualiza un paciente usando control de versión
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { allOf: [{ $ref: '#/components/schemas/PatientWrite' }, { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }] }
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '200':
          description: Paciente actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/pacientes/{patientId}/estudios:
    get:
      tags: [Estudios]
      summary: Lista los estudios de un paciente
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '200':
          description: Estudios encontrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Study' } }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/estudios:
    post:
      tags: [Estudios]
      summary: Crea un estudio
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudyWrite' }
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '201':
          description: Estudio creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Study' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/estudios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Estudios]
      summary: Consulta un estudio
      security: [{ SessionCookie: [] }]
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '200':
          description: Estudio encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Study' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
    put:
      tags: [Estudios]
      summary: Actualiza datos del estudio, sin cambiar paciente ni fecha
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { allOf: [{ $ref: '#/components/schemas/StudyWrite' }, { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }] }
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '200':
          description: Estudio actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Study' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/estudios/{studyId}/documentos:
    get:
      tags: [Documentos]
      summary: Lista metadatos de documentos activos del estudio
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: studyId, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '200':
          description: Lista de documentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DocumentMetadata' } }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
    post:
      tags: [Documentos]
      summary: Carga un archivo individual asociado al estudio
      description: El servidor obtiene patientId del estudio; los campos adicionales no están habilitados en el parser multipart.
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: studyId, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'Un archivo PDF, DOC, DOCX, JPG/JPEG, PNG, GIF, WEBP o DICOM .dcm según la validación actual.' }
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '201':
          description: Archivo cargado y verificado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DocumentUploadResult' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '413': { $ref: '#/components/responses/ApiError' }
        '415': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/documentos/{id}/content:
    get:
      tags: [Documentos]
      summary: Transmite PDF o imagen para visualización inline
      description: Las imágenes requieren documents.read e images.read; DICOM y otros tipos no se sirven inline.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '200':
          description: Contenido binario
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, example: nosniff } }
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '415': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/documentos/{id}/download:
    get:
      tags: [Documentos]
      summary: Descarga un documento
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '200':
          description: Contenido binario como adjunto
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, example: nosniff } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
            application/msword: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: { schema: { type: string, format: binary } }
            application/dicom: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/documentos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Documentos]
      summary: Reemplaza el contenido manteniendo el ID del documento
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '200':
          description: Metadatos actualizados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DocumentReplaceResult' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '413': { $ref: '#/components/responses/ApiError' }
        '415': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
    delete:
      tags: [Documentos]
      summary: Elimina físicamente el archivo y su registro
      security: [{ SessionCookie: [] }]
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '204': { description: Documento eliminado; no hay cuerpo de respuesta }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/respaldos/exportar:
    post:
      tags: [Respaldos]
      summary: Prepara una instantánea clínica para guardar en una carpeta local
      description: Requiere backups.manage. El navegador debe guardar todos los archivos y manifest.json antes de completar la operación. Las referencias de usuario son opcionales y no incluyen contraseñas ni sesiones.
      security: [{ SessionCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                incluirReferenciasUsuarios: { type: boolean, default: false }
      responses:
        default: { $ref: '#/components/responses/ApiError' }
        '201':
          description: Datos clínicos preparados; el cliente todavía debe guardar los archivos y completar el respaldo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BackupExport' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/respaldos/resumen-clinico:
    get:
      tags: [Respaldos]
      summary: Obtiene conteos y una muestra de pacientes actuales
      security: [{ SessionCookie: [] }]
      responses:
        default: { $ref: '#/components/responses/ApiError' }
        '200':
          description: Resumen para la vista previa de restauración
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BackupClinicalSummary' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/respaldos/documentos/{id}:
    get:
      tags: [Respaldos]
      summary: Transmite un documento para guardarlo en el respaldo local
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        default: { $ref: '#/components/responses/ApiError' }
        '200':
          description: Bytes originales del documento como archivo adjunto
          headers:
            Content-Disposition: { schema: { type: string } }
            Content-Length: { schema: { type: integer, format: int64 } }
            X-Document-SHA256:
              description: SHA-256 registrado y verificado antes de abrir el stream.
              schema: { type: string, pattern: '^[a-f0-9]{64}$' }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/respaldos/exportar/{operationId}/completar:
    post:
      tags: [Respaldos]
      summary: Registra que el cliente terminó de guardar la carpeta de respaldo
      description: El cliente llama este endpoint después de escribir manifest.json. La API no recibe la ruta del directorio del navegador.
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        default: { $ref: '#/components/responses/ApiError' }
        '200':
          description: Respaldo marcado como completado y auditado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      operationId: { type: string, format: uuid }
                      completado: { type: boolean, enum: [true] }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/respaldos/restauraciones:
    post:
      tags: [Respaldos]
      summary: Inicia una restauración en modo agregar o reemplazar
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupRestoreStart' }
      responses:
        default: { $ref: '#/components/responses/ApiError' }
        '201':
          description: Operación creada para recibir los registros del respaldo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      operationId: { type: string, format: uuid }
                      modo: { type: string, enum: [agregar, reemplazar] }
                      estado: { type: string, enum: [recibiendo] }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/respaldos/restauraciones/{operationId}/registros:
    post:
      tags: [Respaldos]
      summary: Guarda un lote de registros clínicos recibidos desde la carpeta validada
      description: De 1 a 10 registros, con máximo 256 KiB para el JSON completo. La interfaz divide sus lotes por bytes UTF-8 y envía como máximo cinco registros.
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupRecordBatch' }
      responses:
        default: { $ref: '#/components/responses/ApiError' }
        '201':
          description: Lote recibido
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      recibidos: { type: integer }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '413': { $ref: '#/components/responses/ApiError' }
  /api/respaldos/restauraciones/{operationId}/documentos/{documentId}:
    post:
      tags: [Respaldos]
      summary: Recibe y verifica un archivo del respaldo
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: documentId, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        default: { $ref: '#/components/responses/ApiError' }
        '201':
          description: Archivo recibido en el staging privado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      documentoId: { type: string }
                      recibido: { type: boolean, enum: [true] }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '413': { $ref: '#/components/responses/ApiError' }
        '415': { $ref: '#/components/responses/ApiError' }
        '422':
          description: El archivo recibido no coincide con el nombre, MIME, tamaño o SHA-256 del respaldo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/respaldos/restauraciones/{operationId}/confirmar:
    post:
      tags: [Respaldos]
      summary: Valida el respaldo completo y aplica su restauración
      description: agregar crea IDs nuevos y no fusiona DNI repetidos. reemplazar sustituye los datos clínicos y conserva usuarios y auditoría existente. La API no detiene globalmente el servicio. limpiezaPendiente conserva evidencia de un commit confirmado mientras se reintenta la limpieza física.
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        default: { $ref: '#/components/responses/ApiError' }
        '200':
          description: Restauración confirmada; limpiezaPendiente indica si queda trabajo físico registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BackupRestoreResult' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '422':
          description: Conteos, estructura, relaciones o integridad del respaldo inválidos; también restricciones de MariaDB incumplidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/respaldos/operaciones/{operationId}/cancelar:
    post:
      tags: [Respaldos]
      summary: Cancela una operación propia que todavía está recibiendo datos
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        default: { $ref: '#/components/responses/ApiError' }
        '200':
          description: Operación cancelada y auditada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      operationId: { type: string, format: uuid }
                      cancelada: { type: boolean, enum: [true] }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: hcv_session
      description: Cookie de sesión emitida por POST /api/auth/login; HttpOnly y SameSite=Strict.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[1-9][0-9]*$' }
  responses:
    ApiError:
      description: Error de aplicación. El requestId del cuerpo depende del handler.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    DatabaseUnavailable:
      description: Base de datos no disponible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
  schemas:
    ApiErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string, format: uuid, description: 'Opcional; no todos los handlers lo incluyen en el cuerpo.' }
    AuthenticatedUser:
      type: object
      required: [id, username, displayName, roles]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        roles: { type: array, items: { type: string } }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 100 }
        password: { type: string, format: password, maxLength: 1024 }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
    PatientListItem:
      type: object
      properties:
        id: { type: string }
        fullName: { type: string }
        dni: { type: string, nullable: true }
    PatientWrite:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string, maxLength: 240 }
        dni: { type: string, nullable: true, maxLength: 32 }
        birthDate: { type: string, format: date, nullable: true }
        phone: { type: string, nullable: true, maxLength: 80 }
        address: { type: string, nullable: true, maxLength: 500 }
        notes: { type: string, nullable: true, maxLength: 10000 }
    Patient:
      allOf:
        - $ref: '#/components/schemas/PatientWrite'
        - type: object
          properties:
            id: { type: string }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    StudyWrite:
      type: object
      required: [patientId, type, date]
      properties:
        patientId: { type: string, pattern: '^[1-9][0-9]*$' }
        type: { type: string, maxLength: 160 }
        date: { type: string, format: date }
        professional: { type: string, nullable: true, maxLength: 200 }
        diagnosis: { type: string, nullable: true, maxLength: 10000 }
        procedure: { type: string, nullable: true, maxLength: 10000 }
        description: { type: string, nullable: true, maxLength: 10000 }
        conclusions: { type: string, nullable: true, maxLength: 10000 }
    Study:
      allOf:
        - $ref: '#/components/schemas/StudyWrite'
        - type: object
          properties:
            id: { type: string }
            serviceId: { type: string }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    DocumentMetadata:
      type: object
      properties:
        id: { type: string }
        studyId: { type: string }
        originalName: { type: string }
        mimeType: { type: string }
        sizeBytes:
          oneOf:
            - { type: string }
            - { type: integer, format: int64 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        uploadedBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }
        updatedBy: { type: string, nullable: true }
    DocumentUploadResult:
      allOf:
        - $ref: '#/components/schemas/DocumentMetadata'
        - type: object
          properties:
            patientId: { type: string }
    DocumentReplaceResult:
      allOf:
        - $ref: '#/components/schemas/DocumentUploadResult'
        - type: object
          properties:
            updatedBy: { type: string }
    StorageHealth:
      type: object
      properties:
        status: { type: string, enum: [ready, not_configured, recovering, blocked] }
        message: { type: string }
        operations: { type: array, items: { type: object, additionalProperties: true } }
    BackupConteos:
      type: object
      required: [pacientes, estudios, documentos]
      properties:
        pacientes: { type: integer, minimum: 0 }
        estudios: { type: integer, minimum: 0 }
        documentos: { type: integer, minimum: 0 }
    BackupExport:
      type: object
      required: [operationId, formato, version, creadoEn, conteos, datos]
      properties:
        operationId: { type: string, format: uuid }
        formato: { type: string, enum: [hcv-respaldo-clinico] }
        version: { type: integer, enum: [1] }
        creadoEn: { type: string, format: date-time }
        conteos: { $ref: '#/components/schemas/BackupConteos' }
        datos:
          type: object
          required: [pacientes, estudios, documentos]
          properties:
            pacientes: { type: array, items: { $ref: '#/components/schemas/BackupPatientRecord' } }
            estudios: { type: array, items: { $ref: '#/components/schemas/BackupStudyRecord' } }
            documentos: { type: array, items: { $ref: '#/components/schemas/BackupDocumentRecord' } }
            referenciasUsuarios:
              type: array
              description: Opcional e informativo; nunca contiene contraseñas ni sesiones.
              items: { $ref: '#/components/schemas/BackupUserReference' }
    BackupPatientRecord:
      type: object
      required: [id, fullName, version, createdByUsername, updatedByUsername, createdAt, updatedAt]
      properties:
        id: { type: string }
        fullName: { type: string, maxLength: 240 }
        dni: { type: string, nullable: true, maxLength: 32 }
        birthDate: { type: string, format: date, nullable: true }
        phone: { type: string, nullable: true, maxLength: 80 }
        address: { type: string, nullable: true, maxLength: 500 }
        notes: { type: string, nullable: true }
        version: { type: integer, minimum: 1 }
        createdByUsername: { type: string }
        updatedByUsername: { type: string }
        createdAt: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$' }
        updatedAt: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$' }
    BackupStudyRecord:
      type: object
      required: [id, patientId, serviceCode, type, date, version, createdByUsername, updatedByUsername, createdAt, updatedAt]
      properties:
        id: { type: string }
        patientId: { type: string }
        serviceCode: { type: string }
        type: { type: string, maxLength: 160 }
        date: { type: string, format: date }
        professional: { type: string, nullable: true }
        diagnosis: { type: string, nullable: true }
        procedure: { type: string, nullable: true }
        description: { type: string, nullable: true }
        conclusions: { type: string, nullable: true }
        version: { type: integer, minimum: 1 }
        createdByUsername: { type: string }
        updatedByUsername: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    BackupDocumentRecord:
      type: object
      required: [id, patientId, studyId, originalName, mimeType, sizeBytes, sha256, uploadedByUsername, createdAt, updatedAt, archivePath, derivedFromDocumentId]
      properties:
        id: { type: string }
        patientId: { type: string }
        studyId: { type: string }
        originalName: { type: string, maxLength: 255 }
        mimeType: { type: string, maxLength: 160 }
        sizeBytes: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        uploadedByUsername: { type: string }
        updatedByUsername: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
        archivePath: { type: string, pattern: '^documentos/[^/]+$' }
        derivedFromDocumentId: { type: string, nullable: true }
    BackupUserReference:
      type: object
      required: [username, displayName, isActive, roles]
      properties:
        username: { type: string }
        displayName: { type: string }
        isActive: { type: boolean }
        roles:
          type: array
          items:
            type: object
            properties:
              codigo: { type: string }
              permisos: { type: array, items: { type: string } }
    BackupClinicalSummary:
      type: object
      required: [pacientes, estudios, documentos, muestraPacientes, hayMasPacientes]
      properties:
        pacientes: { type: integer }
        estudios: { type: integer }
        documentos: { type: integer }
        muestraPacientes:
          type: array
          maxItems: 25
          items:
            type: object
            required: [id, nombre]
            properties:
              id: { type: string }
              nombre: { type: string }
              dni: { type: string, nullable: true }
        hayMasPacientes: { type: boolean }
    BackupRestoreStart:
      type: object
      required: [formato, version, modo, conteos]
      properties:
        formato: { type: string, enum: [hcv-respaldo-clinico] }
        version: { type: integer, enum: [1] }
        modo: { type: string, enum: [agregar, reemplazar] }
        conteos: { $ref: '#/components/schemas/BackupConteos' }
    BackupRecordBatch:
      type: object
      required: [tipo, registros]
      properties:
        tipo: { type: string, enum: [pacientes, estudios, documentos] }
        registros:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: object, required: [id], properties: { id: { type: string } }, additionalProperties: true }
    BackupRestoreResult:
      type: object
      required: [operationId, modo, conteos, completado, limpiezaPendiente]
      properties:
        operationId: { type: string, format: uuid }
        modo: { type: string, enum: [agregar, reemplazar] }
        conteos: { $ref: '#/components/schemas/BackupConteos' }
        completado: { type: boolean }
        limpiezaPendiente: { type: boolean }
